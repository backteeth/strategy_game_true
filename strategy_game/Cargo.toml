[package]
name = "strategy_game"
version = "0.1.0"
edition = "2024"
default-run = "strategy_game"

[lib]
name = "strategy_game"
path = "src/lib.rs"

[[bin]]
name = "strategy_game"
path = "src/main.rs"

[[bin]]
name = "profile_1000_states"
path = "src/bin/profile_1000_states.rs"

[dependencies]
bevy = { version = "0.19.0", features = ["dynamic_linking"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
# bevy_text(Parley)が内部で使うicu_providerは、"logging"機能が無効かつdebug buildだと
# `log`クレートを経由せず直接eprintln!へフォールバックする実装のため、通常のログフィルタ
# (main.rsのLogPlugin)で抑制できない。"logging"を明示的に有効化し、通常のtracing経由の
# ログパイプラインへ合流させる(バージョン・その他機能はparley経由の解決に委ねる)。
icu_provider = { version = "2.2.0", features = ["logging"] }

[dev-dependencies]
crossbeam-channel = "0.5"
image = "0.25"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
