[package]
name = "strategy_game"
version = "0.1.0"
edition = "2024"
default-run = "strategy_game"

[lib]
name = "strategy_game"
path = "src/lib.rs"

[[bin]]
name = "strategy_game"
path = "src/main.rs"

[[bin]]
name = "profile_1000_states"
path = "src/bin/profile_1000_states.rs"

[dependencies]
bevy = { version = "0.19.0", features = ["dynamic_linking"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
crossbeam-channel = "0.5"
image = "0.25"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
